# Alembic configuration for HealthyVytals.
#
# The database URL is intentionally NOT set here. env.py reads it from the app's
# settings (HV_DATABASE_URL, SQLite by default), so migrations always target the
# same database the app uses, with no second source of truth to keep in sync.
#
# Beginners never invoke Alembic directly — the scripts/migrate.* wrappers run
# `alembic upgrade head` for them (decision §12.5).

[alembic]
# Path to migration scripts, relative to this file's directory (backend/).
script_location = alembic

# Template used to generate migration filenames: a UTC timestamp prefix keeps
# revisions sortable by creation time in the versions/ directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use the OS path separator when rendering the script location.
prepend_sys_path = .

# Timezone for file_template timestamps.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
