{% extends "base.html" %}

{% block title %}HealthyVytals — Welcome{% endblock %}

{% block nav %}
  <a href="{{ url_for('web-login') }}">Log in</a>
  <a href="{{ url_for('web-register') }}">Register</a>
{% endblock %}

{% block content %}
  <section class="hero">
    <h1>HealthyVytals</h1>
    <p class="tagline">
      A local-first medical portal for patients, nurses, doctors, and clinic admins.
    </p>

    <!--
      HTMX smoke test: this button issues an AJAX GET to a server-rendered
      partial and swaps the returned HTML into #status without a full page
      reload. It proves the Jinja2 + HTMX stack is wired end to end.
    -->
    <button
      hx-get="{{ url_for('web-status') }}"
      hx-target="#status"
      hx-swap="innerHTML"
    >
      Check system status
    </button>

    <div id="status" class="status-slot" aria-live="polite">
      <!-- Server-rendered partial is swapped in here. -->
    </div>
  </section>
{% endblock %}
