{% extends "base.html" %}

{% block title %}Log in — HealthyVytals{% endblock %}

{% block content %}
  <section class="form-card">
    <h1>Log in</h1>
    {% if error %}
      <p class="form-error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('web-login-submit') }}">
      <label>
        Email
        <input type="email" name="email" value="{{ email or '' }}" required autofocus />
      </label>
      <label>
        Password
        <input type="password" name="password" required />
      </label>
      <button type="submit">Log in</button>
    </form>
    <p class="form-alt">
      New patient? <a href="{{ url_for('web-register') }}">Create an account</a>.
    </p>
  </section>
{% endblock %}
